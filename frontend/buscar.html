<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search — Bellaveste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/buscar.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="icon" href="./images/color.jfif">
    <link rel="stylesheet" href="fontello/css/fontello.css">
    <script type="module" src="js/buscar.js"></script>
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/high-contrast.css">
</head>
<body data-page="buscar">
    <header class="barra-superior">
        <div class="fila-marca">
            <nav>
                <label for="chkMenu"><i class="icon-menu"></i></label>
                <input type="checkbox" id="chkMenu">
                <ul id="menu">
                    <li class="menu-header"><label for="chkMenu"><i class="icon-left-open"></i> <span data-i18n="menu">MENU</span></label></li>
                    <li><a href="./inicio-logueado.html"><i class="icon-home"></i><span data-i18n="home">HOME</span></a></li>
                    <li><a href="./perfil.html"><i class="icon-login"></i><span data-i18n="profile">PROFILE</span></a></li>
                    <li><a href="./buscar.html"><i class="icon-search"></i><span data-i18n="search">SEARCH</span></a></li>
                    <li><a href="./inicio-categoria.html"><i class="icon-plus"></i><span data-i18n="collections">COLLECTIONS</span></a></li>
                    <li><a href="./armario.html"><i class="icon-logout"></i><span data-i18n="myCloset">MY CLOSET</span></a></li>
                    <li><a href="./subidaOutfit.html"><i class="icon-plus"></i><span data-i18n="post">POST</span></a></li>
                    <li><a href="./subidos.html"><i class="icon-heart"></i><span data-i18n="myPosts">MY POSTS</span></a></li>
                    <li class="dark-mode-btn" style="cursor:pointer"><i class="icon-moon"></i><span data-i18n="darkMode">DARK MODE</span></li>
                    <li><a href="./perfil.html?tab=ajustes"><i class="icon-cog"></i><span data-i18n="setting">SETTING</span></a></li>
                </ul>
            </nav>
            <div class="marca"><h1>BELLAVESTE</h1><p>SPAIN</p></div>
            <div class="iconos-acciones">
                <a class="boton-icono" href="buscar.html"><i class="icon-search"></i></a>
                <a class="boton-icono" href="armario.html"><i class="icon-shopping-bag"></i></a>
            </div>
        </div>
        <div class="usuario-barra">
            <input type="checkbox" id="chkPerfil">
            <label for="chkPerfil" class="perfil-trigger">
                <span class="nombre-usuario" id="nombre-usuario">USUARIO</span>
                <img class="avatar" id="avatar-usuario" src="images/perfil.jfif" alt="Usuario">
            </label>
            <ul class="menu-perfil">
                <li><a href="./inicio.html" id="logout-link" data-i18n="logout">LOGOUT</a></li>
            </ul>
        </div>
    </header>

    <main class="buscar-main">

        <!-- BARRA DE BÚSQUEDA -->
        <div class="buscar-barra-wrap">
            <div class="buscar-input-wrap">
                <input
                    type="text"
                    id="buscar-input"
                    class="buscar-input"
                    placeholder="Search outfits..."
                    data-i18n-placeholder="searchPlaceholder"
                    autocomplete="off"
                >
                <button class="buscar-btn" id="buscar-btn" type="button">
                    <i class="icon-search"></i>
                </button>

                <!-- AUTOCOMPLETE -->
                <ul class="buscar-sugerencias" id="buscar-sugerencias"></ul>
            </div>

            <!-- BOTÓN ADVANCED SEARCH -->
            <button class="btn-advanced" id="btn-advanced" type="button">
                <i class="icon-sliders"></i> <span data-i18n="advancedSearch">Advanced search</span>
                <i class="icon-down-open advanced-arrow" id="advanced-arrow"></i>
            </button>
        </div>

        <!-- FILTROS AVANZADOS -->
        <div class="filtros-avanzados" id="filtros-avanzados">
            <div class="filtros-grid">
                <div class="filtro-campo">
                    <label class="filtro-label"><i class="icon-resize-full-alt"></i> <span data-i18n="size">SIZE</span></label>
                    <input type="text" id="f-size" class="filtro-input" placeholder="e.g. M, S, XL" data-i18n-placeholder="sizePlaceholder">
                </div>
                <div class="filtro-campo">
                    <label class="filtro-label"><i class="icon-palette"></i> <span data-i18n="colour">COLOUR</span></label>
                    <input type="text" id="f-color" class="filtro-input" placeholder="e.g. black, beige" data-i18n-placeholder="colorPlaceholder">
                </div>
                <div class="filtro-campo">
                    <label class="filtro-label"><i class="icon-tag"></i> <span data-i18n="brand">BRAND</span></label>
                    <input type="text" id="f-brand" class="filtro-input" placeholder="e.g. Zara, H&M" data-i18n-placeholder="brandPlaceholder">
                </div>
                <div class="filtro-campo">
                    <label class="filtro-label"><i class="icon-sun"></i> <span data-i18n="season">SEASON</span></label>
                    <select id="f-season" class="filtro-input">
                        <option value="" data-i18n="allSeasons">All seasons</option>
                        <option value="spring" data-i18n="spring">Spring</option>
                        <option value="summer" data-i18n="summer">Summer</option>
                        <option value="autumn" data-i18n="autumn">Autumn</option>
                        <option value="winter" data-i18n="winter">Winter</option>
                    </select>
                </div>
            </div>
            <button class="btn-aplicar" id="btn-aplicar" type="button">
                <span data-i18n="applyFilters">APPLY FILTERS</span>
            </button>
        </div>

        <!-- RESULTADOS / RECOMENDADOS -->
        <section class="buscar-resultados">
            <div class="resultados-header">
                <h2 class="resultados-titulo" id="resultados-titulo" data-i18n="recommendedOutfits">RECOMMENDED OUTFITS</h2>
                <span class="resultados-count" id="resultados-count"></span>
            </div>
            <div class="resultados-grid" id="resultados-grid">
                <!-- renderizado por JS -->
            </div>
        </section>

        <footer>
            <a class="boton-armario" href="armario.html" data-i18n="footer">VIRTUAL CLOSET</a>
        </footer>

    </main>
    <script type="module" src="js/i18n-global.js"></script>
    <script type="module" src="js/dark-mode.js"></script>
    <script type="module" src="js/high-contrast.js"></script>
</body>
</html>
