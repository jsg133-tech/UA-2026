<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Account — Bellaveste</title>
    <link rel="icon" href="./images/color.jfif">
    <link rel="stylesheet" href="fontello2/css/fontello.css">
    <link rel="stylesheet" href="fontello/css/fontello.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/perfil.css">

    <link rel="stylesheet" href="css/modal.css">
    <script type="module" src="js/perfil.js"></script>
</head>
<body data-page="perfil">
    <header class="barra-superior">
        <div class="fila-marca">

            <nav>
                <label for="chkMenu"><i class="icon-menu"></i></label>
                <input type="checkbox" id="chkMenu">

                <ul id="menu">
                    <li class="menu-header"><label for="chkMenu"><i class="icon-left-open"></i> MENU</label></li>
                    <li><a href="./inicio-logueado.html"><i class="icon-home"></i>HOME</a></li>
                    <li><a href="./perfil.html"><i class="icon-login"></i>PROFILE</a></li>
                    <li><a href="./buscar.html"><i class="icon-search"></i>SEARCH</a></li>
                    <li><a href="./inicio-categoria.html"><i class="icon-plus"></i>COLLECTIONS</a></li>
                    <li><a href="./armario.html"><i class="icon-logout"></i>MY CLOSET</a></li>
                    <li><a href="./subidaOutfit.html"><i class="icon-plus"></i>POST</a></li>
                    <li><i class="icon-moon"></i>DARK MODE</li>
                    <li><i class="icon-setting"></i>SETTING</li>
                </ul>

            </nav>

            <div class="marca">
                <h1>BELLAVESTE</h1>
                <p>SPAIN</p>
            </div>

            <div class="iconos-acciones">
                <a class="boton-icono" href="buscar.html"><i class="icon-search"></i></a>
                <a class="boton-icono" href="armario.html"><i class="icon-shopping-bag"></i></a>
            </div>
        </div>

        <div class="usuario-barra">
            <input type="checkbox" id="chkPerfil">

            <label for="chkPerfil" class="perfil-trigger">
                <span class="nombre-usuario" id="nombre-usuario">USUARIO</span>
                <img class="avatar" id="avatar-usuario" src="images/perfil.jfif" alt="Usuario">
            </label>

            <ul class="menu-perfil">
                <li><a href="./inicio.html">LOGOUT</a></li>
            </ul>
        </div>
    </header>

    <main class="main-perfil">
    <div class="contenedor-ajustes">
        <div class="divisor-titulo">
            <span data-i18n="mainTitle">YOUR ACCOUNT</span>
        </div>

        <nav class="tabs-perfil">
            <button class="tab-btn active" data-target="seccion-editar" data-i18n="editProfile">EDIT PROFILE</button>
            <button class="tab-btn" onclick="location.href='subidos.html'" data-i18n="myPosts">MY POSTS</button>
            <button class="tab-btn" onclick="location.href='armario.html'" data-i18n="closet">CLOSET</button>
            <button class="tab-btn" data-target="seccion-ajustes" data-i18n="settings">SETTINGS</button>
        </nav>

        <div id="seccion-editar" class="tab-content">
            <div class="tarjeta-usuario">
                <div class="avatar-grande">
                    <img src="images/perfil.jfif" alt="Avatar" id="vistaPrevia">
                    <label for="inputFoto" class="cambiar-foto">
                        <i class="icon-camera"></i><span data-i18n="newPhoto">New Photo</span>
                    </label>
                    <input type="file" id="inputFoto" accept="image/*" style="display: none;">
                </div>
                <div class="nombre-destacado" id="perfil-nombre-display">—</div>
            </div>

            <form class="form-perfil" id="form-perfil">
                <div class="campo">
                    <label><i class="icon-user-circle"></i> <span data-i18n="name">NAME:</span></label>
                    <input type="text" id="input-name" placeholder="New name..." data-i18n-placeholder="placeholderName">
                </div>
                <div class="campo">
                    <label><i class="icon-mail"></i> <span data-i18n="email">E-MAIL:</span></label>
                    <input type="email" id="input-email" placeholder="Email..." data-i18n-placeholder="placeholderEmail">
                </div>
                <div class="campo">
                    <label><i class="icon-key"></i> <span data-i18n="newPassword">NEW PASSWORD</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="input-new-password" placeholder="Leave blank to keep current" data-i18n-placeholder="placeholderNewPassword">
                        <button type="button" class="toggle-password" data-target="input-new-password" aria-label="Show password" aria-pressed="false">
                            <i class="icon-eye-off" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="campo">
                    <label><i class="icon-key"></i> <span data-i18n="currentPassword">CURRENT PASSWORD</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="input-current-password" placeholder="Required to save changes" data-i18n-placeholder="placeholderCurrentPassword">
                        <button type="button" class="toggle-password" data-target="input-current-password" aria-label="Show password" aria-pressed="false">
                            <i class="icon-eye-off" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-update" data-i18n="update">UPDATE</button>
            </form>
        </div>

        <div id="seccion-ajustes" class="tab-content" style="display: none;">
            <div class="ajustes-card">
                <div class="ajustes-cabecera">
                    <h3 data-i18n="settingsTitle">Language</h3>
                    <p data-i18n="settingsDescription">Choose the language for this screen.</p>
                </div>

                <div class="language-selector" role="group" aria-label="Language selector">
                    <button type="button" class="lang-btn active" data-language="en">English</button>
                    <button type="button" class="lang-btn" data-language="es">Espanol</button>
                </div>
            </div>

            <div class="ajustes-placeholder">
                <p><i class="icon-cog"></i> <span data-i18n="notificationSettings">Notification Settings</span></p>
                <p><i class="icon-lock"></i> <span data-i18n="privacySecurity">Privacy & Security</span></p>
                <p><i class="icon-help"></i> <span data-i18n="helpCenter">Help Center</span></p>
            </div>
        </div>

        <div class="botones-peligro">
            <button class="btn-logout" type="button" data-i18n="logout">LOGOUT</button>
            <button class="btn-delete" type="button" data-i18n="deleteAccount">DELETE ACCOUNT</button>
        </div>
    </div>
</main>

    <footer>
        <a class="boton-armario" href="#" data-i18n="footer">VIRTUAL CLOSET</a>
    </footer>
    <script type="module" src="js/i18n-global.js"></script>
</body>
</html>
