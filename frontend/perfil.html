<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Account — Bellaveste</title>
    <link rel="icon" href="./images/color.jfif">
    <link rel="stylesheet" href="fontello2/css/fontello.css">
    <link rel="stylesheet" href="fontello/css/fontello.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/perfil.css">

    <link rel="stylesheet" href="css/modal.css">
    <script type="module" src="js/perfil.js"></script>
</head>
<body>
    <header class="barra-superior">
        <div class="fila-marca">

            <nav>
                <label for="chkMenu"><i class="icon-menu"></i></label>
                <input type="checkbox" id="chkMenu">

                <ul id="menu">
                    <li class="menu-header"><label for="chkMenu"><i class="icon-left-open"></i> MENU</label></li>
                    <li><a href="./inicio-logueado.html"><i class="icon-home"></i>HOME</a></li>
                    <li><a href="./perfil.html"><i class="icon-login"></i>PROFILE</a></li>
                    <li><a href="./buscar.html"><i class="icon-search"></i>SEARCH</a></li>
                    <li><a href="./inicio-categoria.html"><i class="icon-plus"></i>COLLECTIONS</a></li>
                    <li><a href="./armario.html"><i class="icon-logout"></i>MY CLOSET</a></li>
                    <li><a href="./subidaOutfit.html"><i class="icon-plus"></i>POST</a></li>
                    <li><i class="icon-moon"></i>DARK MODE</li>
                    <li><i class="icon-setting"></i>SETTING</li>
                </ul>

            </nav>

            <div class="marca">
                <h1>BELLAVESTE</h1>
                <p>SPAIN</p>
            </div>

            <div class="iconos-acciones">
                <a class="boton-icono" href="buscar.html"><i class="icon-search"></i></a>
                <a class="boton-icono" href="armario.html"><i class="icon-shopping-bag"></i></a>
            </div>
        </div>

        <div class="usuario-barra">
            <input type="checkbox" id="chkPerfil">

            <label for="chkPerfil" class="perfil-trigger">
                <span class="nombre-usuario" id="nombre-usuario">USUARIO</span>
                <img class="avatar" id="avatar-usuario" src="images/perfil.jfif" alt="Usuario">
            </label>

            <ul class="menu-perfil">
                <li><a href="./inicio.html">LOGOUT</a></li>
            </ul>
        </div>
    </header>

    <main class="main-perfil">
    <div class="contenedor-ajustes">
        <div class="divisor-titulo">
            <span>YOUR ACCOUNT</span>
        </div>

        <nav class="tabs-perfil">
            <button class="tab-btn active" data-target="seccion-editar">EDIT PROFILE</button>
            <button class="tab-btn" onclick="location.href='subidos.html'">MY POSTS</button>
            <button class="tab-btn" onclick="location.href='armario.html'">CLOSET</button>
            <button class="tab-btn" data-target="seccion-ajustes">SETTINGS</button>
        </nav>

        <div id="seccion-editar" class="tab-content">
            <div class="tarjeta-usuario">
                <div class="avatar-grande">
                    <img src="images/perfil.jfif" alt="Avatar" id="vistaPrevia">
                    <label for="inputFoto" class="cambiar-foto">
                        <i class="icon-camera"></i>New Photo
                    </label>
                    <input type="file" id="inputFoto" accept="image/*" style="display: none;">
                </div>
                <div class="nombre-destacado" id="perfil-nombre-display">—</div>
            </div>

            <form class="form-perfil" id="form-perfil">
                <div class="campo">
                    <label><i class="icon-user-circle"></i> NAME:</label>
                    <input type="text" id="input-name" placeholder="New name...">
                </div>
                <div class="campo">
                    <label><i class="icon-mail"></i> E-MAIL:</label>
                    <input type="email" id="input-email" placeholder="Email...">
                </div>
                <div class="campo">
                    <label><i class="icon-key"></i> NEW PASSWORD</label>
                    <input type="password" id="input-new-password" placeholder="Leave blank to keep current">
                </div>
                <div class="campo">
                    <label><i class="icon-key"></i> CURRENT PASSWORD</label>
                    <input type="password" id="input-current-password" placeholder="Required to save changes">
                </div>
                <button type="submit" class="btn-update">UPDATE</button>
            </form>
        </div>

        <div id="seccion-ajustes" class="tab-content" style="display: none;">
            <div class="ajustes-placeholder">
                <p><i class="icon-cog"></i> Notification Settings</p>
                <p><i class="icon-lock"></i> Privacy & Security</p>
                <p><i class="icon-help"></i> Help Center</p>
            </div>
        </div>

        <div class="botones-peligro">
            <button class="btn-logout" type="button">LOGOUT</button>
            <button class="btn-delete" type="button">DELETE ACCOUNT</button>
        </div>
    </div>
</main>

    <footer>
        <a class="boton-armario" href="#">VIRTUAL CLOSET</a>
    </footer>
</body>
</html>
