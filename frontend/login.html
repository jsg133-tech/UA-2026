 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Bellaveste</title>
  <link rel="icon" href="./images/color.jfif">
  <link rel="stylesheet" href="fontello/css/fontello.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body data-page="login">
  <header class="barra-superior">
    <div class="marca">
      <h1>BELLAVESTE</h1>
      <p>SPAIN</p>
    </div>
    <div class="subtitulo">
      <h2 data-i18n="subtitle">WELCOME BACK</h2>
    </div>
  </header>

  <main>
    <div class="contenedor">
      <form class="formulario" id="form-login" novalidate>
        <div class="campo">
          <label for="email" data-i18n="email">EMAIL</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="contrasena" data-i18n="password">PASSWORD</label>
          <div class="password-wrapper">
            <input type="password" id="contrasena" autocomplete="current-password" required>
            <button type="button" class="toggle-password" data-target="contrasena" aria-label="Show password" aria-pressed="false">
              <i class="icon-eye-off" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="campo recordar">
          <label class="recordar-label" for="recordarme">
            <span class="texto-recordar" data-i18n="remember">Remember me</span>
            <span class="switch">
              <input type="checkbox" id="recordarme">
              <span class="slider"></span>
            </span>
          </label>
        </div>
        <button class="boton-login" type="submit" id="btn-login" data-i18n="loginBtn">LOGIN</button>
        <p class="enlace-registro">
          <span data-i18n="noAccountPrefix">Don't have an account?</span> <a href="registrar.html" data-i18n="noAccountLink">Register here</a>
        </p>
      </form>
    </div>
  </main>

  <footer>
    <a class="boton-armario" href="inicio.html" data-i18n="footer">VIRTUAL CLOSET</a>
  </footer>

  <script type="module" src="js/i18n-global.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
