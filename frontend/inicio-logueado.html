<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bellaveste</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/inicio-logueado.css">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="icon" href="./images/color.jfif">
    <link rel="stylesheet" href="fontello/css/fontello.css">

    <script type="module" src="js/inicio.js"></script>
</head>

<body data-page="inicio-logueado">
    <!-- ENCABEZADO -->
    <header class="barra-superior">
        <div class="fila-marca">

            <nav>
                <label for="chkMenu"><i class="icon-menu"></i></label>
                <input type="checkbox" id="chkMenu">

                <ul id="menu">
                    <li class="menu-header"><label for="chkMenu"><i class="icon-left-open"></i> <span data-i18n="menu">MENU</span></label></li>
                    <li><a href="./inicio-logueado.html"><i class="icon-home"></i><span data-i18n="home">HOME</span></a></li>
                    <li><a href="./perfil.html"><i class="icon-login"></i><span data-i18n="profile">PROFILE</span></a></li>
                    <li><a href="./buscar.html"><i class="icon-search"></i><span data-i18n="search">SEARCH</span></a></li>
                    <li><a href="./inicio-categoria.html"><i class="icon-plus"></i><span data-i18n="collections">COLLECTIONS</span></a></li>
                    <li><a href="./armario.html"><i class="icon-logout"></i><span data-i18n="myCloset">MY CLOSET</span></a></li>
                    <li><a href="./subidaOutfit.html"><i class="icon-plus"></i><span data-i18n="post">POST</span></a></li>
                    <li><a href="./subidos.html"><i class="icon-heart"></i><span data-i18n="myPosts">MY POSTS</span></a></li>
                    <li><i class="icon-moon"></i><span data-i18n="darkMode">DARK MODE</span></li>
                    <li><i class="icon-setting"></i><span data-i18n="setting">SETTING</span></li>
                </ul>

            </nav>

            <div class="marca">
                <h1>BELLAVESTE</h1>
                <p data-i18n="footer">SPAIN</p>
            </div>

            <div class="iconos-acciones">
                <a class="boton-icono" href="buscar.html"><i class="icon-search"></i></a>
                <a class="boton-icono" href="armario.html"><i class="icon-shopping-bag"></i></a>
            </div>
        </div>

        <div class="usuario-barra">
            <input type="checkbox" id="chkPerfil">

            <label for="chkPerfil" class="perfil-trigger">
                <span class="nombre-usuario" id="nombre-usuario">USUARIO</span>
                <img class="avatar" id="avatar-usuario" src="images/perfil.jfif" alt="Usuario">
            </label>

            <ul class="menu-perfil">
                <li><a href="./inicio.html" id="logout-link" data-i18n="logout">LOGOUT</a></li>
            </ul>
        </div>
    </header>

    <main class="contenedor-app">
        <!-- COLECCIONES -->
        <section class="colecciones">
            <h2 data-i18n="collectionsTitle">COLLECTIONS</h2>
            <p data-i18n="collectionsSubtitle">DISCOVER FASHION YOUR WAY</p>

            <div class="categorias">
                <article class="categoria">
                    <a href="categoria-temporada.html" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center;">
                    <img src="images/temporada.jfif" alt="Categoría Temporada">
                    <span data-i18n="season">SEASON</span>
                    </a>
                </article>

                <article class="categoria">
                    <a href="categoria-color.html" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center;">
                        <img src="images/color.jfif" alt="Categoría Color">
                        <span data-i18n="color">COLOR</span>
                    </a>
                </article>

                <article class="categoria">
                    <a href="categoria-mood.html" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center;">
                        <img src="images/ocasion.jfif" alt="Categoría Mood">
                        <span data-i18n="mood">MOOD</span>
                    </a>
                </article>
            </div>
        </section>

        <!-- OUTFIT -->
        <section class="outfit-dia">
            <h2 data-i18n="outfitTitle">OUTFIT</h2>
            <p data-i18n="outfitSubtitle">WHAT WILL YOU WEAR TODAY?</p>
        </section>

        <!-- BOTON FINAL -->
        <footer>
            <a class="boton-armario" href="#" data-i18n="footer">VIRTUAL CLOSET</a>
        </footer>

    </main>

    <script type="module" src="js/i18n-global.js"></script>
    <script type="module" src="js/inicio.js"></script>
</body>
</html>
