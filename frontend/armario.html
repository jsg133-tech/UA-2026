<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bellaveste</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/armario.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="icon" href="./images/color.jfif">
    <link rel="stylesheet" href="fontello/css/fontello.css">

    <script type="module" src="js/armario.js"></script>
</head>

<body data-page="armario">
    <!-- ENCABEZADO -->
    <header class="barra-superior">
        <div class="fila-marca">

            <nav>
                <label for="chkMenu"><i class="icon-menu"></i></label>
                <input type="checkbox" id="chkMenu">

                <ul id="menu">
                    <li class="menu-header"><label for="chkMenu"><i class="icon-left-open"></i> <span data-i18n="menu">MENU</span></label></li>
                    <li><a href="./inicio-logueado.html"><i class="icon-home"></i><span data-i18n="home">HOME</span></a></li>
                    <li><a href="./perfil.html"><i class="icon-login"></i><span data-i18n="profile">PROFILE</span></a></li>
                    <li><a href="./buscar.html"><i class="icon-search"></i><span data-i18n="search">SEARCH</span></a></li>
                    <li><a href="./inicio-categoria.html"><i class="icon-plus"></i><span data-i18n="collections">COLLECTIONS</span></a></li>
                    <li><a href="./armario.html"><i class="icon-logout"></i><span data-i18n="myCloset">MY CLOSET</span></a></li>
                    <li><a href="./subidaOutfit.html"><i class="icon-plus"></i><span data-i18n="post">POST</span></a></li>
                    <li><i class="icon-moon"></i><span data-i18n="darkMode">DARK MODE</span></li>
                    <li><i class="icon-setting"></i><span data-i18n="setting">SETTING</span></li>
                </ul>
            </nav>

            <div class="marca">
                <h1>BELLAVESTE</h1>
                <p data-i18n="location">SPAIN</p>
            </div>

            <div class="iconos-acciones">
                <a class="boton-icono" href="buscar.html"><i class="icon-search"></i></a>
                <a class="boton-icono" href="armario.html"><i class="icon-shopping-bag"></i></a>
            </div>
        </div>

        <div class="usuario-barra">
            <input type="checkbox" id="chkPerfil">

            <label for="chkPerfil" class="perfil-trigger">
                <span class="nombre-usuario" id="nombre-usuario">USUARIO</span>
                <img class="avatar" id="avatar-usuario" src="images/perfil.jfif" alt="Usuario">
            </label>

            <ul class="menu-perfil">
                <li><a href="./inicio.html" id="logout-link" data-i18n="logout">LOGOUT</a></li>
            </ul>
        </div>
    </header>

    <main class="contenedor-armario">
        <section class="mi-armario">
            <div class="armario-header">
                <h2 data-i18n="closetTitle">MY CLOSET</h2>
                <div class="armario-acciones">
                    <button class="btn-toggle-categorias" id="btn-toggle-categorias">
                        <i class="icon-tag"></i>
                        <span data-i18n="categories">CATEGORIES</span>
                        <i class="icon-down-open icono-toggle" id="icono-toggle"></i>
                    </button>
                    <button class="btn-nueva-categoria" id="btn-nueva-categoria">
                        <i class="icon-plus"></i>
                        <span data-i18n="new">NEW</span>
                    </button>
                </div>
            </div>

            <!-- DROPDOWN CATEGORÍAS -->
            <div class="categorias-dropdown" id="categorias-dropdown">
                <div class="categorias-bar" id="categorias-bar"></div>
            </div>

            <!-- FORMULARIO NUEVA CATEGORÍA (oculto por defecto) -->
            <div class="nueva-cat-form" id="nueva-cat-form">
                <input type="text" id="nueva-cat-input" class="nueva-cat-input"
                    placeholder="Category name..." maxlength="30" autocomplete="off" data-i18n-placeholder="categoryPlaceholder">
                <button type="button" id="nueva-cat-ok" class="nueva-cat-btn-ok">
                    <i class="icon-ok"></i>
                </button>
                <button type="button" id="nueva-cat-x" class="nueva-cat-btn-x">
                    <i class="icon-cancel"></i>
                </button>
            </div>

            <!-- GRID DE OUTFITS -->
            <div class="grid-armario" id="grid-armario"></div>

            <!-- PRENDAS GUARDADAS -->
            <div class="prendas-guardadas-seccion" id="prendas-guardadas-seccion" style="display:none">
                <div class="seccion-titulo">
                    <span>SAVED PIECES</span>
                </div>
                <div class="prendas-guardadas-grid" id="prendas-guardadas-grid"></div>
            </div>
        </section>

        <!-- BOTON FINAL -->
        <footer>
            <a class="boton-armario" href="inicio-logueado.html" data-i18n="footer">VIRTUAL CLOSET</a>
        </footer>
    </main>
    <script type="module" src="js/i18n-global.js"></script>
</body>

</html>
