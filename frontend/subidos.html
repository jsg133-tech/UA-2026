<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Outfits — Bellaveste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/subidos.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="icon" href="./images/color.jfif">
    <link rel="stylesheet" href="fontello/css/fontello.css">
    <script type="module" src="js/subidos.js"></script>
</head>
<body data-page="subidos">
    <header class="barra-superior">
        <div class="fila-marca">
            <nav>
                <label for="chkMenu"><i class="icon-menu"></i></label>
                <input type="checkbox" id="chkMenu">
                <ul id="menu">
                    <li class="menu-header"><label for="chkMenu"><i class="icon-left-open"></i> <span data-i18n="menu">MENU</span></label></li>
                    <li><a href="./inicio-logueado.html"><i class="icon-home"></i><span data-i18n="home">HOME</span></a></li>
                    <li><a href="./perfil.html"><i class="icon-login"></i><span data-i18n="profile">PROFILE</span></a></li>
                    <li><a href="./buscar.html"><i class="icon-search"></i><span data-i18n="search">SEARCH</span></a></li>
                    <li><a href="./inicio-categoria.html"><i class="icon-plus"></i><span data-i18n="collections">COLLECTIONS</span></a></li>
                    <li><a href="./armario.html"><i class="icon-logout"></i><span data-i18n="myCloset">MY CLOSET</span></a></li>
                    <li><a href="./subidaOutfit.html"><i class="icon-plus"></i><span data-i18n="post">POST</span></a></li>
                </ul>
            </nav>
            <div class="marca"><h1>BELLAVESTE</h1><p>SPAIN</p></div>
            <div class="iconos-acciones">
                <a class="boton-icono" href="buscar.html"><i class="icon-search"></i></a>
                <a class="boton-icono" href="armario.html"><i class="icon-shopping-bag"></i></a>
            </div>
        </div>
        <div class="usuario-barra">
            <input type="checkbox" id="chkPerfil">
            <label for="chkPerfil" class="perfil-trigger">
                <span class="nombre-usuario" id="nombre-usuario">USUARIO</span>
                <img class="avatar" id="avatar-usuario" src="images/perfil.jfif" alt="Usuario">
            </label>
            <ul class="menu-perfil">
                <li><a href="./inicio.html" id="logout-link" data-i18n="logout">LOGOUT</a></li>
            </ul>
        </div>
    </header>

    <main class="contenedor-subidos">

        <div class="subidos-header">
            <h2 data-i18n="myOutfits">MY OUTFITS</h2>
            <a href="subidaOutfit.html" class="btn-nuevo-outfit">
                <i class="icon-plus"></i> <span data-i18n="newOutfit">NEW OUTFIT</span>
            </a>
        </div>

        <div class="subidos-grid" id="subidos-grid">
            <!-- renderizado por JS -->
        </div>

        <footer>
            <a class="boton-armario" href="armario.html" data-i18n="footer">VIRTUAL CLOSET</a>
        </footer>

    </main>

    <script type="module" src="js/i18n-global.js"></script>
</body>
</html>
